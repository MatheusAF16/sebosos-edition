<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sebosos Edition 🏋️‍♂️🔥</title>

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #111);
      color: #fff;
      padding: 12px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    select {
      padding: 6px;
      border-radius: 6px;
      border: none;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-name {
      text-align: center;
      font-weight: bold;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .day {
      background: #1f2937;
      border-radius: 10px;
      padding: 6px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .day.saturday {
      border: 2px solid #facc15;
    }

    .date {
      font-size: 0.75rem;
      opacity: 0.8;
      margin-bottom: 4px;
    }

    .players {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .on { background: #22c55e; color: #000; }
    .off { background: #ef4444; color: #000; }

    .save-anim {
      animation: pulse 0.6s ease;
    }

    @keyframes pulse {
      0% { transform: scale(1); background:#22c55e; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .summary {
      margin-top: 20px;
      background: #020617;
      padding: 12px;
      border-radius: 12px;
    }

    .summary h2 {
      text-align: center;
      margin-top: 0;
    }

    .score {
      display: flex;
      justify-content: space-around;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<h1>🔥 Sebosos Edition 🔥</h1>

<div class="controls">
  <select id="month"></select>
  <select id="year"></select>
</div>

<div class="calendar" id="calendar"></div>

<div class="summary">
  <h2>😈 Resumo Caótico</h2>
  <div class="score" id="summary"></div>
</div>

<script>
  // 🔥 Firebase init
  const firebaseConfig = {
    apiKey: "AIzaSyBOMibYsRMs_O9aKtB58IPdrA64yzW0kFI",
    authDomain: "sebosos-edition.firebaseapp.com",
    projectId: "sebosos-edition",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const players = ["Matheus", "Nanda"];
  const calendar = document.getElementById("calendar");
  const monthSelect = document.getElementById("month");
  const yearSelect = document.getElementById("year");
  const summaryEl = document.getElementById("summary");

  let data = {};
  let unsubscribe = null;

  const daysNames = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

  function createSelectors() {
    const months = [
      "Janeiro","Fevereiro","Março","Abril","Maio","Junho",
      "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
    ];

    months.forEach((m,i)=>{
      const o=document.createElement("option");
      o.value=i+1; o.textContent=m;
      monthSelect.appendChild(o);
    });

    const year = new Date().getFullYear();
    for(let y=year-1;y<=year+1;y++){
      const o=document.createElement("option");
      o.value=y; o.textContent=y;
      yearSelect.appendChild(o);
    }

    monthSelect.value=new Date().getMonth()+1;
    yearSelect.value=year;
  }

  function loadMonth() {
    const m = monthSelect.value;
    const y = yearSelect.value;
    const docId = `${y}-${m}`;

    if(unsubscribe) unsubscribe();

    unsubscribe = db.collection("planners")
      .doc(docId)
      .onSnapshot(doc=>{
        data = doc.exists ? doc.data().days || {} : {};
        renderCalendar();
        renderSummary();
      });
  }

  function renderCalendar() {
    calendar.innerHTML="";

    daysNames.forEach(d=>{
      const div=document.createElement("div");
      div.className="day-name";
      div.textContent=d;
      calendar.appendChild(div);
    });

    const y=+yearSelect.value;
    const m=+monthSelect.value;
    const firstDay=new Date(y,m-1,1).getDay();
    const totalDays=new Date(y,m,0).getDate();

    for(let i=0;i<firstDay;i++){
      calendar.appendChild(document.createElement("div"));
    }

    for(let d=1;d<=totalDays;d++){
      const date=new Date(y,m-1,d);
      const key=`${y}-${m}-${d}`;
      if(!data[key]) data[key]=[false,false];

      const div=document.createElement("div");
      div.className="day";
      if(date.getDay()===6) div.classList.add("saturday");

      div.innerHTML=`<div class="date">${d}</div>`;
      const pDiv=document.createElement("div");
      pDiv.className="players";

      players.forEach((p,i)=>{
        const btn=document.createElement("button");
        btn.textContent=p;
        btn.className=data[key][i]?"on":"off";

        btn.onclick=async()=>{
          data[key][i]=!data[key][i];

          // sábado cobre falta
          if(date.getDay()===6 && data[key][i]){
            btn.classList.add("save-anim");
          }

          await db.collection("planners")
            .doc(`${y}-${m}`)
            .set({days:data},{merge:true});
        };

        pDiv.appendChild(btn);
      });

      div.appendChild(pDiv);
      calendar.appendChild(div);
    }
  }

  function renderSummary() {
    let score=[0,0];
    Object.values(data).forEach(v=>{
      v.forEach((x,i)=> x && score[i]++);
    });

    summaryEl.innerHTML=players.map((p,i)=>`
      <div>
        <strong>${p}</strong><br>
        🟢 ${score[i]} treinos
      </div>
    `).join("");
  }

  createSelectors();
  loadMonth();
  monthSelect.onchange=loadMonth;
  yearSelect.onchange=loadMonth;
</script>

</body>
</html>
