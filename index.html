<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sebosos Edition 🥵</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg: #f4f7fb;
  --card: #ffffff;
  --primary: #ff6f61;
  --blue: #42a5f5;
  --green: #66bb6a;
  --sat: #ffe3e3;
  --text: #1f2937;
  --muted: #6b7280;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  font-family: "Inter", "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

h1 {
  text-align: center;
  margin-bottom: 12px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

select {
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  font-size: 15px;
  background: #fff;
}

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 6px;
  text-align: center;
  font-weight: 600;
  color: var(--muted);
}

.weekdays .sat { color: #d32f2f; }

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}

.day {
  background: var(--card);
  border-radius: 16px;
  padding: 8px;
  min-height: 120px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.day.sat {
  background: var(--sat);
  border: 2px dashed #ff8a80;
}

.day.empty {
  background: transparent;
  box-shadow: none;
}

.checks {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 6px;
  cursor: pointer;
  font-size: 12px;
  background: #e5e7eb;
}

button.active.p1 {
  background: var(--blue);
  color: #fff;
}

button.active.p2 {
  background: var(--green);
  color: #fff;
}

.summary {
  margin-top: 32px;
  background: var(--card);
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}

.players {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}

.player {
  background: #f9fafb;
  padding: 16px;
  border-radius: 16px;
}

.player h3 {
  margin-top: 0;
}

@media (max-width: 768px) {
  h1 { font-size: 22px; }
  .day { min-height: 100px; }
}
/* ✨ ANIMAÇÕES ✨ */
@keyframes salvarSemana {
  0% { transform: scale(1); box-shadow: 0 0 0 rgba(0,0,0,0); }
  50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(255,105,97,0.8); }
  100% { transform: scale(1); box-shadow: 0 0 0 rgba(0,0,0,0); }
}

.sabado-salvou {
  animation: salvarSemana 0.8s ease-in-out;
}

/* 📊 Barra de progresso */
.progress {
  height: 12px;
  background: #e5e7eb;
  border-radius: 999px;
  overflow: hidden;
  margin: 8px 0 14px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--green));
  width: 0%;
  transition: width 0.5s ease;
}

.print-btn {
  margin-top: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--primary);
  color: #fff;
  font-weight: 600;
}
</style>
</head>
<body>

<h1>🔥 Sebosos Edition 🔥</h1>

<div class="controls">
  <select id="month"></select>
  <select id="year"></select>
</div>

<div class="weekdays">
  <div>Dom</div><div>Seg</div><div>Ter</div>
  <div>Qua</div><div>Qui</div><div>Sex</div>
  <div class="sat">Sáb</div>
</div>

<div class="calendar" id="calendar"></div>

<div class="summary">
  <h2>📊 Resumo Mensal</h2>
  <div class="players">
    <div class="player" id="player1"></div>
    
    <div class="player" id="player2"></div>
  </div>
</div>

<script>
// 📸 Exportar resumo
function exportarResumo() {
  window.print();
}

// 🔥 Firebase config
firebase.initializeApp({
  apiKey: "AIzaSyBOMibYsRMs_O9aKtB58IPdrA64yzW0kFI",
  authDomain: "sebosos-edition.firebaseapp.com",
  projectId: "sebosos-edition"
});

const db = firebase.firestore();

const players = ["Matheus", "Fernanda"];
const calendarEl = document.getElementById("calendar");
const monthSelect = document.getElementById("month");
const yearSelect = document.getElementById("year");

let data = {};
let unsubscribe = null;

function createSelectors() {
  const months = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  months.forEach((m,i)=>{
    const o=document.createElement("option"); o.value=i; o.textContent=m; monthSelect.appendChild(o);
  });
  for(let y=2024;y<=2030;y++){
    const o=document.createElement("option"); o.value=y; o.textContent=y; yearSelect.appendChild(o);
  }
  const now=new Date();
  monthSelect.value=now.getMonth();
  yearSelect.value=now.getFullYear();
}

function loadMonth() {
  const docId = `${yearSelect.value}-${monthSelect.value}`;
  if (unsubscribe) unsubscribe();

  unsubscribe = db.collection("planners").doc(docId)
    .onSnapshot(doc => {
      data = doc.exists ? doc.data().days || {} : {};
      renderCalendar();
      renderSummary();
    });
}

function renderCalendar() {
  calendarEl.innerHTML="";
  const m=+monthSelect.value, y=+yearSelect.value;
  const first=new Date(y,m,1).getDay();
  const total=new Date(y,m+1,0).getDate();

  for(let i=0;i<first;i++){
    calendarEl.appendChild(Object.assign(document.createElement("div"),{className:"day empty"}));
  }

  for(let d=1;d<=total;d++){
    const date=new Date(y,m,d);
    const day=date.getDay();
    const key=`${y}-${m}-${d}`;
    if(!data[key]) data[key]=[false,false];

    const el=document.createElement("div");
    el.className="day"+(day===6?" sat":"");
    el.innerHTML=`<strong>${d}</strong>`;

    const checks=document.createElement("div"); checks.className="checks";
    players.forEach((p,i)=>{
      const b=document.createElement("button");
      b.textContent=p;
      if(data[key][i]) b.classList.add("active","p"+(i+1));
      b.onclick=async()=>{
        data[key][i]=!data[key][i];
        const docId=`${yearSelect.value}-${monthSelect.value}`;
        await db.collection("planners").doc(docId).set({days:data},{merge:true});
      };
      checks.appendChild(b);
    });

    el.appendChild(checks);
    calendarEl.appendChild(el);
  }
}

function renderSummary() {
  players.forEach((p,i)=>{
    let treinos=0, faltas=0, supridas=0;
    const weeks={};

    Object.keys(data).forEach(k=>{
      const [y,m,d]=k.split("-").map(Number);
      const date=new Date(y,m,d);
      const w=`${y}-${getWeek(date)}`;
      if(!weeks[w]) weeks[w]={treinos:0,faltas:0,sab:false};
      const day=date.getDay();
      if(day>=1 && day<=5){ data[k][i]?weeks[w].treinos++:weeks[w].faltas++; }
      if(day===6 && data[k][i]) weeks[w].sab=true;
    });

    Object.values(weeks).forEach(w=>{
      treinos+=w.treinos;
      if(w.sab && w.faltas>0){ supridas+=w.faltas; }
      else faltas+=w.faltas;
    });

    document.getElementById(`player${i+1}`).innerHTML=`
      <h3>${p}</h3>
      <div class="progress"><div class="progress-bar" style="width:${Math.min(100,Math.round((treinos/(treinos+faltas+supridas||1))*100))}%"></div></div>
      <p>🏋️ Treinos no mês: <strong>${treinos}</strong></p>
      <p>😴 Faltas no mês: <strong>${faltas}</strong></p>
      <p>🛟 Faltas cobertas no sábado: <strong>${supridas}</strong></p>
      <button class="print-btn" onclick="exportarResumo()">📸 Exportar resumo</button>
    `;
  });
}

function getWeek(d){
  d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  const yStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-yStart)/86400000)+1)/7);
}

createSelectors();
loadMonth();
monthSelect.onchange=loadMonth;
yearSelect.onchange=loadMonth;
</script>

</body>
</html>
